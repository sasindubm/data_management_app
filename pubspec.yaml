name: data_management_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.1

  # UI & Utilities
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.1
  flutter_speed_dial: ^7.0.0
  intl: ^0.20.2
  crypto: ^3.0.7
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/civiclogo.png"
flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/LOGO1.png
